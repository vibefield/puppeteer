/* Vendored from vibe-field/packages/design-kit/src/tokens.css (2026-09-02). DESIGN.md moves first, then that
   file, then this copy — nothing here is authored in Puppeteer. Godview reads only the §2.5 state colours,

   a transcription rather than an excerpt. */

/* @vibefield/design-kit tokens — transcribed from DESIGN.md; the doc moves first, then this file. */

:root {
  /* Core type stacks. Components consume these instead of repeating a subtly
     different system or monospace stack at every call site. */
  --vf-font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --vf-font-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace;

  /* §2.1 Ground (the canvas) */
  --vf-canvas-bg: #fafafa;
  --vf-canvas-dot: rgba(0, 0, 0, 0.16);
  /* widgetlab-compat aliases */
  --canvas-bg: var(--vf-canvas-bg);
  --canvas-dot: var(--vf-canvas-dot);

  /* §2.2 Surfaces */
  --vf-card: #1c1c1e;
  --vf-card-deep: #000000;
  --vf-card-ink: #ffffff;
  --vf-fill: #f2f2f7;
  --vf-fill-hover: #e5e5ea;

  /* Semantic chrome projection. These are aliases over the art-direction
     palette, not a second palette: shared primitives and domain surfaces use
     the names below so light/dark treatment cannot drift independently. */
  --vf-foreground: #1c1c1e;
  --vf-foreground-inverse: #ffffff;
  --vf-text-primary: rgb(28 28 30 / 85%);
  --vf-text-secondary: rgb(28 28 30 / 70%);
  --vf-text-tertiary: rgb(28 28 30 / 45%);
  --vf-text-faint: rgb(28 28 30 / 30%);
  --vf-hairline: rgb(0 0 0 / 5%);
  --vf-hairline-strong: rgb(0 0 0 / 10%);
  --vf-chrome-solid: #ffffff;
  --vf-chrome-surface: rgb(255 255 255 / 90%);
  --vf-sheet-surface: rgb(255 255 255 / 96%);
  --vf-chrome-surface-soft: rgb(255 255 255 / 58%);
  --vf-chrome-surface-hover: rgb(255 255 255 / 78%);
  --vf-field-surface: rgb(255 255 255 / 60%);
  --vf-wizard-surface: rgb(255 255 255 / 55%);
  --vf-backdrop-dim: rgb(0 0 0 / 10%);

  /* §2.5 State & system color */
  --vf-green: #30d158;
  --vf-orange: #ff9f0a;
  --vf-red: #ff453a;
  --vf-yellow: #ffd60a;
  --vf-cyan: #5ac8fa;
  --vf-select: #4a90d9;
  --vf-state-on-attention: #111111;
  --vf-state-on-solid: #ffffff;

  /* §2.6 Organizational accents — the curated set, assigned per object and used
     as TINT. They group and label; they never signal state (that is §2.5's job,
     above). Transcribed here rather than at each use site because this file is
     the one place transcription is legitimate: the doc moves first, then this. */
  --vf-accent-1: #6366f1;
  --vf-accent-2: #ec4899;
  --vf-accent-3: #22c55e;
  --vf-accent-4: #f59e0b;
  --vf-accent-5: #06b6d4;
  --vf-accent-6: #8b5cf6;
  --vf-accent-7: #ef4444;
  --vf-accent-8: #3b82f6;

  /* Domain content colors. These are stable card identities, not app state. */
  --vf-note-surface: #f6e7a9;
  --vf-note-ink: #3a3524;
  --vf-folder-surface: #1d1d2b;
  --vf-folder-portal: #14141f;
  --vf-folder-ink: #eaeaf4;
  --vf-folder-muted: #8b8ba6;

  /* §2.7 Godview instrument palette — exact values from the Chopsticks
     Godview reference. Both modes live here because Godview owns a local theme
     switch independent of the field behind it. */
  --vf-godview-light-monitor-bg: #f7f7f7;
  --vf-godview-light-panel-bg: #ffffff;
  --vf-godview-light-panel-border: #e0e0e0;
  --vf-godview-light-text-main: #111111;
  --vf-godview-light-text-muted: #888888;
  --vf-godview-light-text-faint: #b8b8b8;
  --vf-godview-light-control-hover-border: #777777;
  --vf-godview-light-control-hover-bg: #f2f2f2;
  --vf-godview-light-idle-bg: #e5e5e5;
  --vf-godview-light-idle-text: #666666;
  --vf-godview-light-working-bg: #222222;
  --vf-godview-light-working-text: #ffffff;
  --vf-godview-light-working-border: #111111;
  --vf-godview-light-terminal-bg: #ece8dc;
  --vf-godview-light-terminal-divider: #d2cec3;

  --vf-godview-dark-monitor-bg: #0a0a0a;
  --vf-godview-dark-panel-bg: #111111;
  --vf-godview-dark-panel-border: #333333;
  --vf-godview-dark-text-main: #ffffff;
  --vf-godview-dark-text-muted: #777777;
  --vf-godview-dark-text-faint: #555555;
  --vf-godview-dark-control-hover-border: #a8a8a8;
  --vf-godview-dark-control-hover-bg: #242424;
  --vf-godview-dark-idle-bg: #2a2a2a;
  --vf-godview-dark-idle-text: #aaaaaa;
  --vf-godview-dark-working-bg: #eeeeee;
  --vf-godview-dark-working-text: #111111;
  --vf-godview-dark-working-border: #ffffff;
  --vf-godview-dark-terminal-bg: #282c34;
  --vf-godview-dark-terminal-divider: #414650;

  --vf-godview-rain-green: #4ade80;
  --vf-godview-rain-green-focus: #22c55e;
  --vf-godview-rain-waiting: #fde047;
  --vf-godview-rain-idle: #cbd5e1;
  --vf-godview-rain-working-head: #ffffff;
  --vf-godview-rain-working-tail: #00ff00;
  --vf-godview-rain-waiting-head: #fef08a;
  --vf-godview-rain-waiting-tail: #eab308;
  --vf-godview-rain-idle-head: #94a3b8;
  --vf-godview-rain-idle-tail: #475569;
  --vf-godview-rain-hover-tail: #d946ef;

  /* §4 Geometry */
  --vf-radius-card: 22px;
  --vf-radius-island: 32px;
  --vf-radius-sheet: 40px;
  --vf-radius-control: 9px;

  /* §8 The file tree. Geometry only — every COLOR the tree wears is one of
     the tokens above. The theme itself ships upstream
     (`@vibecook/mille-ui/theme/vibefield.css`) and reads these by name with
     its own published fallbacks, so the numbers stay ours: change one here
     and the tree follows without a mille release. */
  --vf-tree-row-height: 26px;
  --vf-tree-row-height-compact: 22px;
  --vf-tree-indent: 14px;
  --vf-tree-gutter: 8px;

  /* §5 canonical material recipes. Keeping the complete shadow in a token is
     what lets a side panel in a plugin and a side panel in the shell remain the
     same physical material. */
  --vf-shadow-card: 0 20px 40px rgb(0 0 0 / 15%), 0 0 0 1px rgb(0 0 0 / 5%);
  --vf-shadow-card-lifted: 0 30px 60px rgb(0 0 0 / 22%), 0 0 0 1px rgb(0 0 0 / 6%);
  --vf-shadow-island: 0 8px 30px rgb(0 0 0 / 8%);
  --vf-shadow-sheet: 0 -20px 40px rgb(0 0 0 / 8%);
  --vf-shadow-top-sheet: 0 20px 40px rgb(0 0 0 / 8%);
  --vf-shadow-side-panel: -20px 0 40px rgb(0 0 0 / 8%);
  --vf-shadow-dialog: 0 42px 100px rgb(0 0 0 / 18%), 0 12px 36px rgb(0 0 0 / 10%);
  --vf-shadow-wizard: 0 8px 30px rgb(0 0 0 / 8%);

  /* §6 Motion */
  --vf-ease-island: cubic-bezier(0.25, 1, 0.3, 1);
  --vf-ease-lift: cubic-bezier(0.2, 0.9, 0.3, 1.2);
  --vf-ease-pop: cubic-bezier(0.34, 1.45, 0.64, 1);

  /* §7 Interactive states — the engine's P4 union box wraps rounded cards
     (world px; the chrome reflector zoom-scales it — widgetlab App law) */
  --ic-selection-radius: 22px;

  /* §7 Interactive states — overlap glow/rim knobs (light defaults) */
  --ic-glow-color: 255, 255, 255;
  --ic-glow-size-t: 60px;
  --ic-glow-size-c: 60px;
  --ic-glow-alpha-t: 0.5;
  --ic-glow-alpha-c: 0.25;
  --ic-rim-color: 224, 224, 224;
  --ic-rim-alpha-t: 0.85;
  --ic-rim-alpha-c: 0.55;
  --ic-rim-width: 1.5px;
  --ic-rim-radius: 600px;
}

.dark {
  /* §2.1 Ground */
  --vf-canvas-bg: #171717;
  --vf-canvas-dot: rgba(255, 255, 255, 0.08);

  /* §2.2 Surfaces */
  --vf-fill: #2c2c2e;
  --vf-fill-hover: #2c2c2e;

  --vf-foreground: #f5f5f7;
  --vf-foreground-inverse: #1c1c1e;
  --vf-text-primary: rgb(245 245 247 / 85%);
  --vf-text-secondary: rgb(245 245 247 / 70%);
  --vf-text-tertiary: rgb(245 245 247 / 45%);
  --vf-text-faint: rgb(245 245 247 / 30%);
  --vf-hairline: rgb(255 255 255 / 10%);
  --vf-hairline-strong: rgb(255 255 255 / 15%);
  --vf-chrome-solid: #1c1c1e;
  --vf-chrome-surface: rgb(28 28 30 / 90%);
  --vf-sheet-surface: rgb(28 28 30 / 96%);
  --vf-chrome-surface-soft: rgb(255 255 255 / 5%);
  --vf-chrome-surface-hover: rgb(255 255 255 / 8%);
  --vf-field-surface: rgb(255 255 255 / 6%);
  --vf-wizard-surface: rgb(28 28 30 / 55%);
  --vf-backdrop-dim: rgb(0 0 0 / 40%);
  --vf-shadow-island: 0 8px 30px rgb(0 0 0 / 40%);
  --vf-shadow-sheet: 0 -20px 40px rgb(0 0 0 / 40%);
  --vf-shadow-top-sheet: 0 20px 40px rgb(0 0 0 / 40%);
  --vf-shadow-side-panel: -20px 0 40px rgb(0 0 0 / 40%);
  --vf-shadow-dialog: 0 48px 120px rgb(0 0 0 / 48%), 0 14px 40px rgb(0 0 0 / 30%);
  --vf-shadow-wizard: 0 8px 30px rgb(0 0 0 / 40%);

  /* §7 Interactive states — reviewed neutral glow/rim on dark */
  --ic-glow-color: 110, 110, 110;
  --ic-rim-color: 92, 92, 92;
}

/* Godview's instrument skin, ported from vibe-field/packages/field-app/src/godview/godview.css
   (DESIGN.md §1.1, §2.7). The selectors are vibe-field's so the two apps iterate on one skin.

   What differs is host mechanics, not design: the window IS the Godview, so the overlay's open/close
   transition is gone and the header doubles as the window's drag region; the runtime inspector, the
   notification feed and the account-usage chrome exist only here and are drawn in the same tokens; the
   mock/remote chips, the mesh fault faces, the kill affordance, the perf readout and the terminal-mode
   switch have no counterpart here and are not ported. Status words are Core's — idle · working ·
   blocked — where vibe-field says waiting for the third. */

* {
  box-sizing: border-box;
}

html,
body,
#root {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: transparent;
}

body {
  user-select: none;
}

:root {
  color-scheme: light;
}

:root[data-theme='dark'] {
  color-scheme: dark;
}

/* ── Godview: exact Chopsticks instrument skin (DESIGN.md §1.1) ─────────────
   Every visible surface below reads the reference palette through these scoped
   names; the tokens themselves live in tokens.css. */
.vf-godview.theme-light,
.vf-godview-tweak-panel.theme-light {
  --monitor-bg: var(--vf-godview-light-monitor-bg);
  --panel-bg: var(--vf-godview-light-panel-bg);
  --panel-border: var(--vf-godview-light-panel-border);
  --text-main: var(--vf-godview-light-text-main);
  --text-muted: var(--vf-godview-light-text-muted);
  --text-faint: var(--vf-godview-light-text-faint);
  --control-hover-border: var(--vf-godview-light-control-hover-border);
  --control-hover-bg: var(--vf-godview-light-control-hover-bg);
  --grid-line: rgba(0, 0, 0, 0.022);
  --idle-bg: var(--vf-godview-light-idle-bg);
  --idle-text: var(--vf-godview-light-idle-text);
  --working-bg: var(--vf-godview-light-working-bg);
  --working-text: var(--vf-godview-light-working-text);
  --working-border: var(--vf-godview-light-working-border);
  --blocked-bg: var(--vf-card-deep);
  --blocked-text: var(--vf-godview-light-panel-bg);
  --blocked-border: var(--vf-card-deep);
  --terminal-bg: var(--vf-godview-light-terminal-bg);
  --terminal-divider: var(--vf-godview-light-terminal-divider);
  --pane-access-text: rgba(20, 20, 20, 0.6);
  --pane-access-border: rgba(0, 0, 0, 0.12);
  --pane-access-bg: rgba(247, 247, 247, 0.8);
  --crt-scanline: rgba(0, 0, 0, 0.08);
  --crt-vignette: rgba(0, 0, 0, 0.15);
  color-scheme: light;
}

.vf-godview.theme-dark,
.vf-godview-tweak-panel.theme-dark {
  --monitor-bg: var(--vf-godview-dark-monitor-bg);
  --panel-bg: var(--vf-godview-dark-panel-bg);
  --panel-border: var(--vf-godview-dark-panel-border);
  --text-main: var(--vf-godview-dark-text-main);
  --text-muted: var(--vf-godview-dark-text-muted);
  --text-faint: var(--vf-godview-dark-text-faint);
  --control-hover-border: var(--vf-godview-dark-control-hover-border);
  --control-hover-bg: var(--vf-godview-dark-control-hover-bg);
  --grid-line: rgba(255, 255, 255, 0.035);
  --idle-bg: var(--vf-godview-dark-idle-bg);
  --idle-text: var(--vf-godview-dark-idle-text);
  --working-bg: var(--vf-godview-dark-working-bg);
  --working-text: var(--vf-godview-dark-working-text);
  --working-border: var(--vf-godview-dark-working-border);
  --blocked-bg: var(--vf-godview-dark-text-main);
  --blocked-text: var(--vf-card-deep);
  --blocked-border: var(--vf-godview-dark-text-main);
  --terminal-bg: var(--vf-godview-dark-terminal-bg);
  --terminal-divider: var(--vf-godview-dark-terminal-divider);
  --pane-access-text: rgba(255, 255, 255, 0.62);
  --pane-access-border: rgba(255, 255, 255, 0.14);
  --pane-access-bg: rgba(22, 24, 29, 0.82);
  --crt-scanline: rgba(0, 0, 0, 0.3);
  --crt-vignette: rgba(0, 0, 0, 0.75);
  color-scheme: dark;
}

/* The whole window. The stage surface controls (color, opacity, blur) paint
   here, so the deck's renderer-native pane alpha shows this glass through it. */
.vf-godview {
  position: relative;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  color: var(--text-main);
  background: color-mix(
    in srgb,
    var(--vf-godview-stage-color, var(--monitor-bg)) var(--vf-godview-stage-opacity, 100%),
    transparent
  );
  backdrop-filter: blur(var(--vf-godview-stage-blur, 0));
  font-family: ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Monaco, Consolas, monospace;
  font-synthesis: none;
  transition:
    color 240ms ease,
    background-color 240ms ease;
  user-select: none;
}

.vf-godview button,
.vf-godview kbd,
.vf-godview select {
  font: inherit;
}

.vf-godview-header,
.vf-godview-monitor-stage,
.vf-monitor-swarm,
.vf-godview-terminal-deck,
.vf-godview-terminal-deck .ghostty-window,
.vf-godview-terminal-deck .ghosttea-workspace-body,
.vf-godview-terminal-deck .terminal-host,
.vf-godview-terminal-deck .ghostty-pane {
  transition:
    color 240ms ease,
    border-color 240ms ease,
    background-color 240ms ease;
}

.vf-godview-header {
  position: relative;
  z-index: 20;
  height: 40px;
  flex: 0 0 40px;
  display: grid;
  grid-template-columns: minmax(160px, 1fr) auto minmax(160px, 1fr);
  align-items: center;
  padding: 0 15px;
  border-bottom: 1px solid var(--panel-border);
  background: var(--panel-bg);
  -webkit-app-region: drag;
}

/* The window's own lights, drawn only where the OS does not draw them. */
.vf-godview-window-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.platform-darwin .vf-godview-window-controls {
  visibility: hidden;
}

.vf-godview-window-controls i {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  box-shadow: inset 0 -1px 1px rgb(0 0 0 / 18%);
}

.vf-godview-window-controls .is-close {
  background: #ff5f57;
}

.vf-godview-window-controls .is-minimize {
  background: #febc2e;
}

.vf-godview-window-controls .is-expand {
  background: #28c840;
}

.vf-godview-title {
  display: flex;
  align-items: baseline;
  gap: 8px;
  color: var(--text-main);
  letter-spacing: 0.12em;
  white-space: nowrap;
}

.vf-godview-title span {
  font-size: 11px;
  font-weight: 800;
}

.vf-godview-title small {
  color: var(--text-muted);
  font-size: 8px;
  font-weight: 700;
}

.vf-godview-header-actions,
.vf-godview-status-controls {
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  -webkit-app-region: no-drag;
}

.vf-godview-header-actions {
  gap: 8px;
}

.vf-godview-status-controls {
  gap: 6px;
}

.vf-godview-status-controls button,
.vf-godview-view-switch,
.vf-godview-tweak-toggle {
  border: 1px solid var(--panel-border);
  color: var(--text-muted);
  background: transparent;
  font-weight: 700;
  cursor: pointer;
  transition: 120ms ease;
}

.vf-godview-status-controls button {
  min-width: 0;
  padding: 3px 7px;
  border-radius: 5px;
  font-size: 9px;
  letter-spacing: 0.04em;
}

.vf-godview-status-controls kbd {
  margin-left: 5px;
  color: var(--text-faint);
  font-size: 8px;
  font-weight: 400;
}

.vf-godview-view-switch {
  height: 22px;
  padding: 0 4px;
  border-radius: 5px;
  font-size: 9px;
  letter-spacing: 0.04em;
}

.vf-godview-tweak-toggle {
  height: 22px;
  padding: 0 7px;
  border-radius: 6px;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.08em;
}

.vf-godview-status-controls button:hover,
.vf-godview-view-switch:hover,
.vf-godview-tweak-toggle:hover,
.vf-godview-tweak-toggle.is-open {
  border-color: var(--control-hover-border);
  color: var(--text-main);
  background: var(--control-hover-bg);
}

.vf-godview-view-switch:focus-visible,
.vf-godview-tweak-toggle:focus-visible,
.vf-godview-status-controls button:focus-visible {
  outline: 1px solid var(--text-main);
  outline-offset: 2px;
}

.vf-godview-theme-switch {
  height: 22px;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 5px;
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  color: var(--text-muted);
  background: transparent;
  font-size: 9px;
  cursor: pointer;
  transition:
    color 160ms ease,
    border-color 160ms ease,
    background-color 160ms ease;
}

.vf-godview-theme-switch:hover {
  border-color: var(--control-hover-border);
  color: var(--text-main);
  background: var(--control-hover-bg);
}

.vf-godview-theme-switch:focus-visible {
  outline: 1px solid var(--text-main);
  outline-offset: 2px;
}

.vf-godview-theme-switch > span:first-child,
.vf-godview-theme-switch > span:last-child {
  line-height: 1;
  opacity: 0.38;
  transition: opacity 160ms ease;
}

.vf-godview-theme-switch[aria-checked='false'] > span:first-child,
.vf-godview-theme-switch[aria-checked='true'] > span:last-child {
  opacity: 1;
}

.vf-godview-theme-switch-track {
  position: relative;
  width: 22px;
  height: 12px;
  flex: 0 0 22px;
  border: 1px solid var(--panel-border);
  border-radius: 999px;
  background: var(--control-hover-bg);
}

.vf-godview-theme-switch-track i {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-main);
  transition: transform 180ms ease;
}

.vf-godview-theme-switch[aria-checked='true'] .vf-godview-theme-switch-track i {
  transform: translateX(10px);
}

/* The bounded transition feed. Puppeteer-only: the runtime's attention hints,
   in the panel's own material. */
.vf-godview-monitor-feed {
  position: absolute;
  z-index: 80;
  top: 48px;
  right: 12px;
  width: min(340px, calc(100% - 24px));
  display: flex;
  flex-direction: column;
  gap: 5px;
  pointer-events: none;
}

.vf-godview-monitor-notice {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 9px;
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  color: var(--text-main);
  background: var(--panel-bg);
  box-shadow: 0 8px 22px rgb(0 0 0 / 18%);
  font-size: 9px;
  pointer-events: auto;
}

.vf-godview-monitor-notice span {
  flex: 1;
}

.vf-godview-monitor-notice button {
  border: 0;
  color: var(--text-muted);
  background: transparent;
  cursor: pointer;
}

/* The system-control panel wears the exact reference TweakPanel shell. It is
   portalled to the body so it paints above the WebGPU pane compositor. */
.vf-godview-tweak-panel {
  position: fixed;
  z-index: 1000;
  top: 48px;
  right: 8px;
  width: min(280px, calc(100vw - 16px));
  max-height: calc(100vh - 56px);
  overflow: auto;
  border: 1px solid var(--panel-border);
  border-radius: 7px;
  color: var(--text-main);
  background: var(--panel-bg);
  box-shadow: 0 16px 38px rgba(0, 0, 0, 0.28);
  font-family: ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Monaco, Consolas, monospace;
  font-size: 10px;
  font-synthesis: none;
  user-select: none;
  -webkit-app-region: no-drag;
}

.vf-godview-tweak-panel button,
.vf-godview-tweak-panel select {
  font: inherit;
}

.vf-godview-tweak-header {
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 9px 0 11px;
  border-bottom: 1px solid var(--panel-border);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.12em;
}

.vf-godview-tweak-header button {
  width: 21px;
  height: 21px;
  padding: 0;
  border: 0;
  border-radius: 4px;
  color: var(--text-muted);
  background: transparent;
  font-size: 17px;
  line-height: 1;
  cursor: pointer;
}

.vf-godview-tweak-header button:hover {
  color: var(--text-main);
  background: var(--control-hover-bg);
}

.vf-godview-tweak-theme {
  height: 36px;
  display: grid;
  grid-template-columns: 1fr 112px;
  align-items: center;
  gap: 8px;
  padding: 0 11px;
  border-bottom: 1px solid var(--panel-border);
  color: var(--text-muted);
}

.vf-godview-tweak-theme select {
  width: 100%;
  height: 23px;
  padding: 0 6px;
  border: 1px solid var(--panel-border);
  border-radius: 4px;
  color: var(--text-main);
  background: var(--control-hover-bg);
}

.vf-godview-tweak-group {
  min-width: 0;
  margin: 0;
  padding: 7px 11px 10px;
  border: 0;
  border-bottom: 1px solid var(--panel-border);
}

.vf-godview-tweak-group legend {
  width: calc(100% + 22px);
  margin-left: -11px;
  padding: 7px 11px 4px;
  color: var(--text-faint);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.1em;
}

.vf-godview-tweak-control {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 62px;
  align-items: center;
  gap: 4px 8px;
  padding: 4px 0;
  color: var(--text-muted);
}

.vf-godview-tweak-control output {
  overflow: hidden;
  color: var(--text-main);
  font-variant-numeric: tabular-nums;
  text-align: right;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.vf-godview-tweak-control input[type='range'] {
  width: 100%;
  height: 12px;
  grid-column: 1 / -1;
  margin: 0;
  accent-color: var(--text-main);
  cursor: ew-resize;
}

.vf-godview-tweak-control.is-color input[type='color'] {
  width: 100%;
  height: 18px;
  grid-column: 1 / -1;
  padding: 0;
  border: 1px solid var(--panel-border);
  border-radius: 4px;
  background: transparent;
  cursor: pointer;
}

.vf-godview-tweak-reset {
  width: calc(100% - 22px);
  height: 26px;
  margin: 9px 11px 11px;
  border: 1px solid var(--panel-border);
  border-radius: 4px;
  color: var(--text-muted);
  background: transparent;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.08em;
  cursor: pointer;
}

.vf-godview-tweak-reset:hover {
  border-color: var(--control-hover-border);
  color: var(--text-main);
  background: var(--control-hover-bg);
}

/* The stage is the shell's; whichever view is mounted fills it, and the chrome
   overlays it. Views inherit no layout beyond these bounds. The window owns the
   glass, so the stage paints nothing of its own. */
.vf-godview-monitor-stage {
  position: relative;
  width: 100%;
  height: var(--vf-monitor-stage-height, 35%);
  min-height: 170px;
  flex: 0 0 var(--vf-monitor-stage-height, 35%);
  overflow: hidden;
  border-bottom: 1px solid var(--panel-border);
  background: transparent;
}

.vf-monitor-chrome {
  position: absolute;
  z-index: 7;
  top: 11px;
  left: 13px;
  width: min(300px, calc(100% - 26px));
  color: var(--text-main);
}

/* The account-usage readout that rides the chrome slot. Puppeteer-only. */
.vf-account-usage-panel {
  color: var(--text-main);
}

.vf-account-usage-providers {
  display: grid;
}

.vf-account-usage-provider {
  min-width: 0;
  min-height: 27px;
  display: grid;
  grid-template-columns: 53px minmax(0, 1fr);
  align-items: center;
  gap: 4px;
  padding: 2px 0;
}

.vf-account-usage-provider-name {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--text-muted);
  font-size: 7px;
  font-weight: 900;
  letter-spacing: 0.06em;
}

.vf-account-usage-provider-label {
  min-width: 0;
  display: grid;
  gap: 1px;
  line-height: 1;
}

.vf-account-usage-provider-label small {
  overflow: hidden;
  color: var(--text-faint);
  font-size: 5px;
  font-weight: 800;
  letter-spacing: 0;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.vf-account-usage-provider-icon {
  width: 11px;
  height: 11px;
  display: grid;
  place-items: center;
  flex: 0 0 11px;
  color: var(--text-main);
  font-size: 9px;
}

.vf-account-usage-metrics {
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 4px;
}

.vf-account-usage-metric {
  min-width: 0;
  display: grid;
  grid-template-rows: 8px 2px 7px;
  gap: 1px;
}

.vf-account-usage-metric:only-child {
  max-width: 78px;
}

.vf-account-usage-metric-copy {
  min-width: 0;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 2px;
  line-height: 1;
}

.vf-account-usage-metric-copy small,
.vf-account-usage-metric-copy strong,
.vf-account-usage-reset {
  overflow: hidden;
  white-space: nowrap;
}

.vf-account-usage-metric-copy small {
  color: var(--text-faint);
  font-size: 6px;
  font-weight: 900;
  letter-spacing: 0.04em;
  text-overflow: ellipsis;
}

.vf-account-usage-metric-copy strong {
  color: var(--text-main);
  font-size: 7px;
  font-variant-numeric: tabular-nums;
}

.vf-account-usage-track {
  position: relative;
  height: 2px;
  overflow: hidden;
  border-radius: 2px;
  background: color-mix(in srgb, var(--text-main) 9%, transparent);
}

.vf-account-usage-track > i {
  position: absolute;
  inset: 0 auto 0 0;
  border-radius: inherit;
  background: var(--text-main);
  transition: width 360ms cubic-bezier(0.22, 1, 0.36, 1);
}

.vf-account-usage-reset {
  color: var(--text-faint);
  font-size: 6px;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  text-overflow: ellipsis;
}

.vf-account-usage-status {
  overflow: hidden;
  color: var(--text-faint);
  font-size: 7px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.vf-account-usage-provider.is-unavailable .vf-account-usage-provider-icon,
.vf-account-usage-provider.is-rate-limited .vf-account-usage-provider-icon,
.vf-account-usage-provider.is-unauthenticated .vf-account-usage-provider-icon,
.vf-account-usage-provider.is-unsupported .vf-account-usage-provider-icon {
  color: var(--text-faint);
  background: transparent;
}

/* The runtime inspector for the active agent. Puppeteer-only; the same panel
   material and the instrument's type. Blocked takes §2.5's needs-attention
   orange, the Godview ring-1 colour. */
.vf-godview-monitor-inspector {
  position: absolute;
  z-index: 8;
  top: 11px;
  right: 13px;
  width: min(470px, calc(100% - 340px));
  max-height: calc(100% - 22px);
  overflow: auto;
  padding: 9px 11px;
  border: 1px solid var(--panel-border);
  border-radius: 7px;
  color: var(--text-main);
  background: color-mix(in srgb, var(--panel-bg) 94%, transparent);
  box-shadow: 0 8px 30px color-mix(in srgb, #000 18%, transparent);
  backdrop-filter: blur(18px);
  font-size: 9px;
}

.vf-godview-monitor-inspector > header,
.vf-godview-monitor-inspector section > h4,
.vf-godview-monitor-inspector li,
.vf-godview-inspector-blocker,
.vf-godview-inspector-question {
  display: flex;
  align-items: baseline;
  gap: 7px;
}

.vf-godview-monitor-inspector > header {
  justify-content: space-between;
  padding-bottom: 7px;
  letter-spacing: 0.08em;
}

.vf-godview-monitor-inspector > header span,
.vf-godview-monitor-inspector small {
  color: var(--text-muted);
}

/* The account rides beside the title; the status keeps the right edge. */
.vf-godview-monitor-inspector > header small {
  overflow: hidden;
  margin: 0 auto 0 0;
  color: var(--text-faint);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.vf-godview-monitor-inspector > header .is-blocked,
.vf-godview-inspector-blocker.is-failure,
.vf-godview-inspector-blocker.is-question,
.vf-godview-inspector-blocker.is-permission {
  color: var(--vf-orange);
}

.vf-godview-inspector-metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 4px;
}

.vf-godview-inspector-metric {
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 4px 5px;
  border: 1px solid var(--panel-border);
  border-radius: 4px;
}

.vf-godview-inspector-metric strong {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.vf-godview-monitor-inspector section {
  display: grid;
  gap: 4px;
  margin-top: 8px;
  padding-top: 7px;
  border-top: 1px solid var(--panel-border);
}

.vf-godview-monitor-inspector h4,
.vf-godview-monitor-inspector ol,
.vf-godview-monitor-inspector ul,
.vf-godview-monitor-inspector p {
  margin: 0;
}

.vf-godview-monitor-inspector ol,
.vf-godview-monitor-inspector ul {
  display: grid;
  gap: 3px;
  padding-left: 17px;
}

.vf-godview-monitor-inspector li {
  justify-content: space-between;
}

.vf-godview-inspector-blocker,
.vf-godview-inspector-question {
  align-items: stretch;
  flex-direction: column;
}

.vf-godview-monitor-inspector button {
  width: fit-content;
  padding: 2px 6px;
  border: 1px solid var(--panel-border);
  border-radius: 3px;
  color: inherit;
  background: transparent;
  cursor: pointer;
}

.vf-godview-monitor-inspector pre {
  max-height: 120px;
  margin: 4px 0 0;
  overflow: auto;
  white-space: pre-wrap;
}

.vf-godview-inspector-readiness {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.vf-monitor-empty {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  gap: 7px;
  color: var(--text-muted);
  text-align: center;
  pointer-events: none;
}

.vf-monitor-empty span {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.18em;
}

.vf-monitor-empty small {
  color: var(--text-faint);
  font-size: 9px;
}

/* List view — the same exact non-spatial reading as the reference. */
.vf-monitor-list {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-top: calc(var(--vf-monitor-chrome-height, 0px) + 18px);
  color: var(--text-main);
}

.vf-monitor-list-toolbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 13px 6px;
  color: var(--text-faint);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.06em;
}

.vf-monitor-list-new {
  padding: 3px 7px;
  border: 1px solid var(--panel-border);
  border-radius: 5px;
  color: var(--text-muted);
  background: transparent;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: 120ms ease;
}

.vf-monitor-list-new:hover {
  border-color: var(--control-hover-border);
  color: var(--text-main);
  background: var(--control-hover-bg);
}

.vf-monitor-list-rows {
  flex: 1 1 auto;
  margin: 0;
  padding: 0 13px 13px;
  overflow-y: auto;
  list-style: none;
}

.vf-monitor-list-row {
  width: 100%;
  min-height: var(--vf-monitor-row-height, 38px);
  display: grid;
  grid-template-columns:
    10px var(--vf-monitor-project-width, 150px) minmax(0, 0.9fr)
    minmax(0, 1.4fr) 44px;
  align-items: center;
  gap: 10px;
  padding: 0 9px;
  border: 1px solid transparent;
  border-left: 3px solid transparent;
  border-radius: 6px;
  color: inherit;
  background: transparent;
  text-align: left;
  cursor: pointer;
  transition: 120ms ease;
}

.vf-monitor-list-row:hover {
  border-color: var(--control-hover-border);
  background: var(--control-hover-bg);
}

.vf-monitor-list-row.is-linked {
  border-left-color: var(--agent-color);
}

.vf-monitor-list-row.is-active {
  border-color: var(--agent-color);
  background: var(--control-hover-bg);
  outline: none;
}

.vf-monitor-list-row:focus-visible {
  outline: 2px solid var(--agent-color);
  outline-offset: -2px;
}

.vf-monitor-list-row.is-stale {
  opacity: 0.58;
}

.vf-monitor-list-status {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--agent-color);
}

.vf-monitor-list-row.is-idle .vf-monitor-list-status {
  opacity: 0.4;
}

.vf-monitor-list-row.is-blocked .vf-monitor-list-status {
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--agent-color) 30%, transparent);
}

.vf-monitor-list-project {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.vf-monitor-list-project strong {
  overflow: hidden;
  color: inherit;
  font-size: 11px;
  font-weight: 700;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.vf-monitor-list-project small,
.vf-monitor-list-agent,
.vf-monitor-list-detail,
.vf-monitor-list-context,
.vf-monitor-list-terminal {
  overflow: hidden;
  color: var(--text-muted);
  font-size: 9px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.vf-monitor-list-agent {
  display: flex;
  align-items: center;
  gap: 5px;
}

.vf-monitor-list-agent i {
  display: flex;
  color: inherit;
  font-size: 11px;
}

/* The account a run is bound to: an identity ground beside the agent's name,
   never a state. */
.vf-monitor-list-agent small {
  overflow: hidden;
  color: var(--text-faint);
  font-size: 8px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.vf-monitor-list-terminal {
  color: var(--text-faint);
  font-style: italic;
}

.vf-monitor-list-context {
  color: var(--text-faint);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.vf-monitor-list > .vf-monitor-empty {
  position: static;
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--text-faint);
  font-size: 10px;
  letter-spacing: 0.08em;
}

/* Rain view deliberately paints black in both themes. */
.vf-monitor-rain {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: var(--vf-card-deep);
}

.vf-monitor-rain canvas {
  position: absolute;
  inset: 0;
  display: block;
}

.vf-monitor-rain-surface {
  position: absolute;
  inset: 0;
  cursor: crosshair;
}

.vf-monitor-rain-tooltip {
  position: absolute;
  z-index: 8;
  width: 224px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 9px 11px;
  border: 1px solid rgba(0, 255, 0, 0.55);
  border-radius: 4px;
  color: var(--vf-godview-rain-green);
  background: rgba(0, 10, 0, 0.95);
  box-shadow: 0 0 20px rgba(0, 255, 0, 0.25);
  font-family: 'Courier New', Courier, monospace;
  font-size: 10px;
  pointer-events: none;
}

.vf-monitor-rain-tooltip.is-blocked {
  border-color: rgba(234, 179, 8, 0.65);
  color: var(--vf-godview-rain-waiting);
  box-shadow: 0 0 20px rgba(234, 179, 8, 0.25);
}

.vf-monitor-rain-tooltip.is-idle {
  border-color: rgba(148, 163, 184, 0.55);
  color: var(--vf-godview-rain-idle);
  box-shadow: none;
}

.vf-monitor-rain-tooltip-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 0;
  padding-bottom: 4px;
  border-bottom: 1px solid currentcolor;
}

.vf-monitor-rain-tooltip-head strong {
  overflow: hidden;
  color: var(--vf-godview-dark-text-main);
  font-size: 11px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.vf-monitor-rain-tooltip-head span {
  flex: 0 0 auto;
  color: inherit;
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.vf-monitor-rain-tooltip dl {
  margin: 0;
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr);
  gap: 2px 6px;
}

.vf-monitor-rain-tooltip dt {
  color: inherit;
  font: inherit;
  opacity: 0.6;
}

.vf-monitor-rain-tooltip dd {
  margin: 0;
  overflow: hidden;
  color: inherit;
  font-size: inherit;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.vf-monitor-rain-context {
  margin: 2px 0 0;
  display: flex;
  align-items: center;
  gap: 6px;
  color: inherit;
  font-size: inherit;
}

.vf-monitor-rain-context-track {
  flex: 1 1 auto;
  height: 4px;
  overflow: hidden;
  border: 1px solid currentcolor;
  border-radius: 2px;
  background: transparent;
}

.vf-monitor-rain-context-track i {
  display: block;
  height: 100%;
  border-radius: 0;
  background: currentcolor;
}

.vf-monitor-rain-agents {
  position: absolute;
  z-index: 9;
  top: 0;
  left: 0;
  width: auto;
  height: auto;
  margin: 0;
  padding: 0;
  overflow: visible;
  clip-path: none;
  list-style: none;
  white-space: normal;
}

.vf-monitor-rain-agents button {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  border: 0;
  padding: 0;
  clip-path: inset(50%);
  white-space: nowrap;
}

.vf-monitor-rain-agents button:focus-visible {
  position: static;
  width: auto;
  height: auto;
  padding: 4px 8px;
  border: 1px solid var(--vf-godview-rain-green-focus);
  border-radius: 4px;
  clip-path: none;
  color: var(--vf-godview-rain-green);
  background: rgba(0, 10, 0, 0.95);
  font-family: 'Courier New', Courier, monospace;
  font-size: 10px;
}

.vf-monitor-rain > .vf-monitor-empty {
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: rgba(74, 222, 128, 0.65);
  font-family: 'Courier New', Courier, monospace;
  font-size: 10px;
  letter-spacing: 0.08em;
}

/* The deck. Ghosttea draws the terminal tint with renderer-native alpha; an
   opaque CSS deck would hide both that alpha and the window's glass below it. */
.vf-godview-terminal-deck {
  position: relative;
  min-width: 0;
  min-height: 0;
  flex: 1 1 auto;
  overflow: hidden;
  background: transparent;
}

/* A live WebGPU canvas may be promoted above ordinary DOM overlays on macOS.
   Compositing the deck while the panel is open keeps the body-level panel on
   top without changing the visible terminal alpha. */
.vf-godview[data-godview-tuning-open='true'] .vf-godview-terminal-deck {
  opacity: 0.999;
}

.vf-godview-terminal-deck .ghostty-window,
.vf-godview-terminal-deck .ghosttea-workspace-body,
.vf-godview-terminal-deck .terminal-host,
.vf-godview-terminal-deck .ghostty-pane {
  background: transparent;
}

.vf-godview.theme-light .vf-godview-terminal-deck .ghostty-window {
  color-scheme: light;
}

.vf-godview.theme-dark .vf-godview-terminal-deck .ghostty-window {
  color-scheme: dark;
}

.vf-godview-terminal-deck .ghostty-window {
  width: 100%;
  height: 100%;
}

.vf-godview .ghosttea-workspace-sidebar {
  display: none;
}

.vf-godview-terminal-deck .ghosttea-settings-button {
  opacity: 0.78;
}

.vf-godview-terminal-deck .appearance-settings-backdrop {
  position: fixed;
}

.vf-godview-terminal-deck .appearance-settings-page .appearance-panel:first-child h2::before {
  display: inline-block;
  margin-right: 8px;
  padding: 2px 6px;
  border: 1px solid rgb(255 255 255 / 16%);
  border-radius: 999px;
  color: rgb(238 241 247 / 72%);
  background: rgb(255 255 255 / 7%);
  font-size: 9px;
  letter-spacing: 0.08em;
  vertical-align: 2px;
}

.vf-godview.theme-light .vf-godview-terminal-deck .appearance-settings-page .appearance-panel:first-child h2::before {
  content: 'LIGHT MODE';
}

.vf-godview.theme-dark .vf-godview-terminal-deck .appearance-settings-page .appearance-panel:first-child h2::before {
  content: 'DARK MODE';
}

.vf-godview-terminal-deck .ghostty-pane-badge {
  padding: 3px 9px;
  color: var(--vf-godview-dark-text-main);
  background: var(--ghostty-pane-color);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  transition:
    color 160ms ease,
    background-color 160ms ease,
    box-shadow 160ms ease;
}

.vf-godview-terminal-deck .ghostty-pane:not(.is-active) .ghostty-pane-badge {
  color: var(--ghostty-pane-color);
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--ghostty-pane-color);
}

.vf-godview-terminal-deck .ghostty-pane.is-active[data-pane-accent]::before {
  border-color: var(--ghostty-pane-color);
  box-shadow: inset 0 0 12px color-mix(in srgb, var(--ghostty-pane-color) 18%, transparent);
}

.vf-godview-terminal-deck .ghostty-split-divider {
  background: var(--terminal-divider);
}

.vf-godview-terminal-deck .ghostty-pane-access {
  top: 24px;
  color: var(--pane-access-text);
  border-color: var(--pane-access-border);
  background: var(--pane-access-bg);
}

.vf-godview-scanlines,
.vf-godview-vignette {
  position: absolute;
  z-index: 30;
  inset: 0;
  pointer-events: none;
}

.vf-godview-scanlines {
  background: linear-gradient(to bottom, transparent 50%, var(--crt-scanline) 51%);
  background-size: 100% var(--vf-scanline-density, 2px);
  opacity: var(--vf-scanline-opacity, 0.4);
}

.vf-godview-vignette {
  background: radial-gradient(circle at center, transparent 52%, var(--crt-vignette) 100%);
  opacity: var(--vf-vignette-opacity, 1);
  transition:
    background 240ms ease,
    opacity 120ms ease;
}

@media (max-width: 840px) {
  .vf-godview-status-controls kbd,
  .vf-godview-title small {
    display: none;
  }

  .vf-godview-status-controls button {
    padding-inline: 5px;
    font-size: 8px;
  }

  .vf-godview-tweak-toggle {
    padding-inline: 5px;
  }

  .vf-godview-monitor-inspector {
    top: 86px;
    left: 13px;
    width: calc(100% - 26px);
    max-height: calc(100% - 97px);
  }
}

@media (max-width: 680px) {
  .vf-godview-header {
    grid-template-columns: auto 1fr;
  }

  .vf-godview-status-controls {
    display: none;
  }

  .vf-godview-title {
    justify-self: start;
  }
}

@media (prefers-reduced-motion: reduce) {
  .vf-account-usage-track > i {
    transition: none;
  }
}

/* The swarm design lab's own layout. Colours are the Godview tokens: the page root carries
   `vf-godview theme-light|dark`, so the swarm palette resolves exactly as it does in the app. */

/* The app stylesheet pins html and body to the window; the lab is a document that scrolls. */
html,
body {
  height: auto;
  min-height: 100%;
  margin: 0;
  overflow: auto;
  background: #0a0a0a;
  user-select: text;
}

.swarm-lab.vf-godview {
  position: relative;
  min-height: 100vh;
  height: auto;
  display: block;
  overflow: visible;
  user-select: text;
}

.lab-canvas {
  position: absolute;
  z-index: 0;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  pointer-events: none;
}

.lab-header,
.lab-parts,
.lab-notice {
  position: relative;
  z-index: 2;
}

.lab-header {
  max-width: 1080px;
  margin: 0 auto;
  padding: 36px 28px 8px;
}

.lab-header h1 {
  margin: 0 0 6px;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.lab-header p {
  max-width: 68ch;
  margin: 0 0 18px;
  color: var(--text-muted);
  font-size: 12px;
  line-height: 1.5;
}

.lab-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 18px;
  padding: 10px 12px;
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  background: color-mix(in srgb, var(--panel-bg) 88%, transparent);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.lab-theme {
  padding: 4px 10px;
  border: 1px solid var(--panel-border);
  border-radius: 5px;
  color: var(--text-main);
  background: var(--panel-bg);
  font: inherit;
  cursor: pointer;
}

.lab-check,
.lab-slider {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text-muted);
}

.lab-slider input {
  width: 90px;
  accent-color: var(--text-main);
}

.lab-slider-value {
  min-width: 3ch;
  color: var(--text-main);
  font-variant-numeric: tabular-nums;
}

.lab-notice {
  max-width: 1080px;
  margin: 12px auto;
  padding: 10px 28px;
  color: var(--vf-orange);
  font-size: 12px;
}

.lab-parts {
  max-width: 1080px;
  margin: 0 auto;
  padding: 8px 28px 80px;
}

.lab-part h2 {
  margin: 34px 0 4px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.lab-lede {
  max-width: 68ch;
  margin: 0 0 14px;
  font-size: 12px;
  line-height: 1.5;
  color: var(--text-muted);
}

.lab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 14px;
}

.lab-stage {
  margin: 0;
  border: 1px solid color-mix(in srgb, var(--panel-border) 70%, transparent);
  border-radius: 10px;
}

.lab-cell {
  height: 176px;
}

.lab-marks {
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
}

.lab-mark-cell {
  height: 84px;
}

.lab-stage figcaption {
  padding: 0 12px 12px;
  font-size: 10.5px;
  line-height: 1.45;
  color: var(--text-muted);
}

.lab-stage figcaption b {
  display: block;
  color: var(--text-main);
  font-weight: 800;
}

.lab-cluster {
  height: 340px;
  border: 1px solid color-mix(in srgb, var(--panel-border) 70%, transparent);
  border-radius: 10px;
}

    <div class="lab-controls"></div>
