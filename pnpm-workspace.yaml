packages:
  - packages/*
  - apps/*
# Temporary sibling-checkout overrides for Godview development. Remove this
# block and run pnpm install to return to the versions in package.json.
overrides:
  '@vibecook/ghosttea': link:../electron-ghostty/packages/ghosttea
  '@vibecook/ghosttea-client': link:../electron-ghostty/packages/ghosttea-client
  '@vibecook/ghosttea-electron': link:../electron-ghostty/packages/ghosttea-electron
  '@vibecook/ghosttea-frame': link:../electron-ghostty/packages/ghosttea-frame
  '@vibecook/ghosttea-native-tabs': link:../electron-ghostty/packages/ghosttea-native-tabs
  '@vibecook/ghosttea-protocol': link:../electron-ghostty/packages/ghosttea-protocol
  '@vibecook/ghosttea-react': link:../electron-ghostty/packages/ghosttea-react
  '@vibecook/ghosttead': link:../electron-ghostty/packages/ghosttead
allowBuilds:
  '@parcel/watcher': true
  '@vibecook/truffle': true
  better-sqlite3: true
  electron: true
  esbuild: true
  # Live adapter tests need a real PTY; its official prebuild selector and
  # macOS helper-permission repair are the only lifecycle scripts we permit.
  node-pty: true
minimumReleaseAgeExclude:
  - '@vibecook/ghosttea@0.9.3'
  - '@vibecook/ghosttea-electron@0.9.3'
  - '@vibecook/ghosttea-frame@0.9.3'
  - '@vibecook/ghosttea-native-tabs@0.9.3'
  - '@vibecook/ghosttea-protocol@0.9.3'
  - '@vibecook/ghosttea-react@0.9.3'
  - '@vibecook/ghosttead@0.9.3'
  # The daemon platform packages arrive as optional dependencies of
  # @vibecook/ghosttead, and the release-age quarantine applies to them too.
  - '@vibecook/ghosttead-darwin-arm64@0.9.3'
  - '@vibecook/ghosttead-win32-x64@0.9.3'
  - '@vibecook/ghosttea-client@0.9.3'
  - '@vibecook/truffle-native@0.7.12'
  - '@vibecook/truffle-sidecar-darwin-arm64@0.7.12'
  - '@vibecook/truffle-sidecar-darwin-x64@0.7.12'
  - '@vibecook/truffle-sidecar-linux-arm64@0.7.12'
  - '@vibecook/truffle-sidecar-linux-x64@0.7.12'
  - '@vibecook/truffle-sidecar-win32-x64@0.7.12'
  - '@vibecook/truffle@0.7.12'
verifyDepsBeforeRun: false
