version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directories: ['/', '/packages/*', '/apps/*']
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
