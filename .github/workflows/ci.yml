name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter './packages/**'
      - run: pnpm format:check
        if: runner.os == 'Linux'
      - run: pnpm packages:check
      - run: pnpm support:check
      - run: pnpm upstream:check
      - run: pnpm surface:audit
      - name: Test repository automation
        run: node --test scripts/*.test.mjs
      - run: pnpm -r --filter './packages/**' typecheck
      # Process-backed adapter tests need enough CPU for their own deadlines.
      # Real Git/process integration tests need a larger budget on hosted runners.
      - run: pnpm -r --no-bail --workspace-concurrency=1 --filter './packages/**' test --testTimeout=15000
      - run: pnpm -r --filter './packages/**' build
      - run: node scripts/pack-check.mjs

  apps:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm -r --filter './apps/**' typecheck
      - run: pnpm -r --filter './apps/**' test
      # Linux validates the bundle graph without unavailable native prebuilds.
      - run: pnpm godview:bundle
        if: runner.os == 'Linux'

  ci:
    name: CI required
    if: ${{ always() }}
    needs: [packages, apps]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix job to pass
        env:
          PACKAGES_RESULT: ${{ needs.packages.result }}
          APPS_RESULT: ${{ needs.apps.result }}
        run: test "$PACKAGES_RESULT" = success && test "$APPS_RESULT" = success
