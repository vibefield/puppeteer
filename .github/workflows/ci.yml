name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter './packages/**'
      - run: pnpm format:check
        if: runner.os == 'Linux'
      - run: pnpm packages:check
      - run: pnpm support:check
      - run: pnpm upstream:check
      - run: pnpm surface:audit
      - name: Test repository automation
        run: node --test scripts/*.test.mjs
      - run: pnpm -r --filter './packages/**' typecheck
      # Process-backed adapter tests need enough CPU for their own deadlines.
      # Real Git/process integration tests need a larger budget on hosted runners.
      - run: pnpm -r --no-bail --workspace-concurrency=1 --filter './packages/**' test --testTimeout=15000
      # All platform tests use the minimum supported Node. Linux then matches
      # the release runtime to verify clean npm consumers as well as tarball contents.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: runner.os == 'Linux'
        with:
          node-version: 22.22.2
          package-manager-cache: false
      - name: Install the release npm CLI in an isolated directory
        if: runner.os == 'Linux'
        # npm 10 cannot safely replace its own files while upgrading itself to npm 12.
        run: |
          npm install --prefix "$RUNNER_TEMP/puppeteer-npm" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund npm@12.0.1
          echo "PUPPETEER_NPM_CLI=$RUNNER_TEMP/puppeteer-npm/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/puppeteer-npm/node_modules/npm/bin/npm-cli.js" --version
      - run: node scripts/pack-check.mjs --consumer
        if: runner.os == 'Linux'
      # Packing runs every public package's prepack build and validates its output.
      - run: node scripts/pack-check.mjs
        if: runner.os != 'Linux'

  apps:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
          cache: pnpm
      - name: Build the pinned Ghosttea SDK used by local development
        run: node scripts/prepare-ghosttea-ci.mjs
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: pnpm -r --filter './apps/**' typecheck
      - run: pnpm -r --filter './apps/**' test
      # Linux validates the bundle graph without unavailable native prebuilds.
      - run: pnpm godview:bundle
        if: runner.os == 'Linux'

  ci:
    name: CI required
    if: ${{ always() }}
    needs: [packages, apps]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix job to pass
        env:
          PACKAGES_RESULT: ${{ needs.packages.result }}
          APPS_RESULT: ${{ needs.apps.result }}
        run: test "$PACKAGES_RESULT" = success && test "$APPS_RESULT" = success
