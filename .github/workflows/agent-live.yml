name: Agent live reconciliation

on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-live-reconciliation
  cancel-in-progress: false

# Nightly reconciliation rehearses the protected promotion lanes instead of keeping a second copy of them:
# for every opted-in agent it dispatches agent-surface-promotion.yml with confirm=rehearse for the version
# the support ledger selects (candidate, else current). That run acquires the exact upstream bytes, refuses
# them if they differ from the evidence's reviewed digest, and drives the adapter through the real native TUI
# on all four GitHub-hosted platforms, then verifies the platform matrix (and, for a staged candidate, the
# promotion transaction), but never reaches the protected promote job. Set the repository variable
# <VENDOR>_LIVE_ENABLED=true to opt an agent in; a source-revision agent (Hermes) also needs
# <VENDOR>_SOURCE_REFERENCE, the exact release tag of the selected version.
jobs:
  rehearse:
    name: rehearse ${{ matrix.vendor }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # actions: write is what dispatching a workflow needs; only the dispatch step receives the token.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - vendor: claude
            enabled: ${{ vars.CLAUDE_LIVE_ENABLED }}
          - vendor: codex
            enabled: ${{ vars.CODEX_LIVE_ENABLED }}
          - vendor: grok
            enabled: ${{ vars.GROK_LIVE_ENABLED }}
          - vendor: hermes
            enabled: ${{ vars.HERMES_LIVE_ENABLED }}
            source_reference: ${{ vars.HERMES_SOURCE_REFERENCE }}
          - vendor: kimi
            enabled: ${{ vars.KIMI_LIVE_ENABLED }}
          - vendor: opencode
            enabled: ${{ vars.OPENCODE_LIVE_ENABLED }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: ${{ matrix.enabled == 'true' }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ matrix.enabled == 'true' }}
        with:
          node-version: 22.18.0
          package-manager-cache: false
      - name: Select the ledger version to rehearse
        id: select
        if: ${{ matrix.enabled == 'true' }}
        env:
          VENDOR: ${{ matrix.vendor }}
          SOURCE_REFERENCE: ${{ matrix.source_reference }}
        run: |
          version=$(node scripts/agent-model-selection.mjs --vendor "$VENDOR" --field version)
          ground_truth=$(node scripts/agent-model-selection.mjs --vendor "$VENDOR" --field groundTruthRelative)
          strategy=$(node -e "console.log(require('./packages/surface/vendors/$VENDOR/upstream.json').acquisition.strategy)")
          if [ "$strategy" = source-revision ] && [ -z "$SOURCE_REFERENCE" ]; then
            echo "::error::$VENDOR acquires a source revision; set ${VENDOR^^}_SOURCE_REFERENCE to the exact release tag of $version"
            exit 1
          fi
          {
            echo "version=$version"
            echo "ground_truth=$ground_truth"
          } >> "$GITHUB_OUTPUT"
      # The dispatched run's guard job validates every input again before any lane starts.
      - name: Rehearse the protected promotion lanes for the ledger-selected version
        if: ${{ matrix.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VENDOR: ${{ matrix.vendor }}
          VERSION: ${{ steps.select.outputs.version }}
          GROUND_TRUTH: ${{ steps.select.outputs.ground_truth }}
          SOURCE_REFERENCE: ${{ matrix.source_reference }}
        run: |
          gh workflow run agent-surface-promotion.yml \
            --ref "$GITHUB_REF_NAME" \
            -f vendor="$VENDOR" \
            -f version="$VERSION" \
            -f ground_truth="$GROUND_TRUTH" \
            -f source_reference="$SOURCE_REFERENCE" \
            -f confirm=rehearse
          echo "rehearsing $VENDOR $VERSION from $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
