name: Agent live reconciliation

on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-live-reconciliation
  cancel-in-progress: false

# Live agents need installed vendor binaries; some lanes also need isolated
# credentials. Repository variables keep each job explicitly disabled until a
# suitable self-hosted runner with the `puppeteer-agent-live` label is available.
jobs:
  claude-surface:
    if: ${{ vars.CLAUDE_LIVE_ENABLED == 'true' }}
    runs-on: [self-hosted, puppeteer-agent-live]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter './packages/**'
      - name: Probe the installed Claude surface
        env:
          PUPPETEER_REAL_CLAUDE: '1'
          PUPPETEER_CLAUDE_BIN: ${{ vars.CLAUDE_BIN }}
        run: pnpm --filter @vibecook/puppeteer-adapter-claude test

  codex-live:
    if: ${{ vars.CODEX_LIVE_ENABLED == 'true' }}
    runs-on: [self-hosted, puppeteer-agent-live]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter './packages/**'
      - name: Run Codex real-artifact lanes
        env:
          CODEX_LIVE: '1'
          PUPPETEER_CODEX_BIN: ${{ vars.CODEX_BIN }}
        run: pnpm --filter @vibecook/puppeteer-adapter-codex test

  grok-live:
    if: ${{ vars.GROK_LIVE_ENABLED == 'true' }}
    runs-on: [self-hosted, puppeteer-agent-live, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter './packages/**'
      - name: Run Grok native-TUI/leader/ACP/durable-store proof
        env:
          GROK_LIVE: '1'
          PUPPETEER_GROK_BIN: ${{ vars.GROK_BIN }}
        run: pnpm --filter @vibecook/puppeteer-adapter-grok test

  hermes-surface:
    if: ${{ vars.HERMES_LIVE_ENABLED == 'true' }}
    runs-on: [self-hosted, puppeteer-agent-live, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter './packages/**'
      - name: Prepare isolated Hermes census state
        run: mkdir -p .agent-live/hermes-home
      - name: Recheck the pinned installed-console identity
        run: >-
          node packages/surface/vendors/hermes/census/harness.mjs
          --hermes-bin "${{ vars.HERMES_BIN }}"
          --home .agent-live/hermes-home
          --checkout "${{ vars.HERMES_CHECKOUT }}"
      - name: Re-run the controlled tui_gateway Surface census
        run: >-
          node packages/surface/vendors/hermes/census/turn-census.mjs
          --python "${{ vars.HERMES_PYTHON }}"
          --checkout "${{ vars.HERMES_CHECKOUT }}"
          --scenario basic-turn
          --output .agent-live/hermes@0.20.0
      - name: Recheck the adapter through the pinned native TUI
        env:
          HERMES_LIVE: '1'
          PUPPETEER_HERMES_BIN: ${{ vars.HERMES_BIN }}
          HERMES_PYTHON: ${{ vars.HERMES_PYTHON }}
          HERMES_TUI_DIR: ${{ vars.HERMES_TUI_DIR }}
        run: pnpm --filter @vibecook/puppeteer-adapter-hermes test

  kimi-live:
    if: ${{ vars.KIMI_LIVE_ENABLED == 'true' }}
    runs-on: [self-hosted, puppeteer-agent-live, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter './packages/**'
      - name: Run the controlled Kimi Surface census against the installed binary
        env:
          PUPPETEER_KIMI_BIN: ${{ vars.KIMI_BIN }}
        run: >-
          node packages/surface/vendors/kimi/census/harness.mjs
          --artifact "$PUPPETEER_KIMI_BIN"
          --version 0.34.0
          --scenario basic-turn
          --output .agent-live/kimi@0.34.0
      - name: Run the Kimi adapter through the real native TUI and durable wire
        env:
          KIMI_LIVE: '1'
          PUPPETEER_KIMI_BIN: ${{ vars.KIMI_BIN }}
        run: pnpm --filter @vibecook/puppeteer-adapter-kimi test

  opencode-live:
    if: ${{ vars.OPENCODE_LIVE_ENABLED == 'true' }}
    runs-on: [self-hosted, puppeteer-agent-live, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter './packages/**'
      - name: Run OpenCode through the real native TUI, private backend, and HTTP/SSE wire
        env:
          OPENCODE_LIVE: '1'
          PUPPETEER_OPENCODE_BIN: ${{ vars.OPENCODE_BIN }}
        run: pnpm --filter @vibecook/puppeteer-adapter-opencode test
