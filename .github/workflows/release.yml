name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z release tag to retry after successful main CI
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Ignore superseded main commits
        id: current
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { data } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            core.setOutput('matches', data.object.sha === context.payload.workflow_run.head_sha);
      - id: release
        if: steps.current.outputs.matches == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
      # GITHUB_TOKEN-created PRs can require approval before their PR event runs.
      # Explicit dispatch runs read-only CI on the bot branch without a PAT.
      - name: Run CI for the release PR
        if: steps.current.outputs.matches == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({ ...context.repo, state: 'open', base: 'main' });
            for (const pr of prs) {
              if (pr.head.repo?.full_name !== process.env.GITHUB_REPOSITORY ||
                  !pr.head.ref.startsWith('release-please--branches--main') ||
                  !pr.labels.some(label => label.name === 'autorelease: pending')) continue;
              await github.rest.actions.createWorkflowDispatch({ ...context.repo, workflow_id: 'ci.yml', ref: pr.head.ref });
            }

  publish:
    needs: release-please
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      vars.NPM_PUBLISH_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Validate tag input
        env:
          RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable vX.Y.Z tag'; exit 1; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      - name: Verify tag, version, main ancestry, and successful CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$VERSION"
          git merge-base --is-ancestor HEAD origin/main
          SHA=$(git rev-parse HEAD)
          PASSED=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push&status=success" --jq '.total_count')
          test "$PASSED" -gt 0 || { echo 'No successful main CI for this exact release commit'; exit 1; }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted-publishing support
        run: npm install --global npm@12.0.1
      - run: pnpm install --frozen-lockfile --filter './packages/**'
      - run: pnpm -r --filter './packages/**' typecheck
      - run: pnpm -r --no-bail --workspace-concurrency=1 --filter './packages/**' test
      - run: pnpm -r --filter './packages/**' build
      - run: node scripts/pack-check.mjs
      - name: Publish lockstep package train
        env:
          # npm provenance is supported only for public source repositories.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}
        run: node scripts/publish-packages.mjs
