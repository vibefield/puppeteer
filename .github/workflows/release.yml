name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z release tag to retry after successful main CI
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Ignore superseded main commits
        id: current
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            core.setOutput('matches', data.object.sha === context.payload.workflow_run.head_sha);
      - id: release
        if: steps.current.outputs.matches == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
      - name: Dispatch publication from the release tag
        if: steps.release.outputs.release_created == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag)) throw new Error('Expected a stable release tag');
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'release.yml', ref: tag, inputs: { tag },
            });

  publish:
    needs: release-please
    if: >-
      always() && !cancelled() && vars.NPM_PUBLISH_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || github.ref == format('refs/tags/{0}', inputs.tag))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Validate tag input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable vX.Y.Z tag'; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - name: Verify tag, version, main ancestry, and successful CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$VERSION"
          git merge-base --is-ancestor HEAD origin/main
          SHA=$(git rev-parse HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
            test "$GITHUB_SHA" = "$SHA"
          fi
          PASSED=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push&status=success" --jq '.total_count')
          test "$PASSED" -gt 0 || { echo 'No successful main CI for this exact release commit'; exit 1; }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # npm 12 requires Node 22.22.2 or newer on the Node 22 line.
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted-publishing support
        # Keep the bundled npm intact while installing the CLI used for publication.
        run: |
          npm install --prefix "$RUNNER_TEMP/puppeteer-npm" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund npm@12.0.1
          echo "PUPPETEER_NPM_CLI=$RUNNER_TEMP/puppeteer-npm/node_modules/npm/bin/npm-cli.js" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/puppeteer-npm/node_modules/npm/bin/npm-cli.js" --version
      - run: pnpm install --frozen-lockfile --filter './packages/**'
      - run: pnpm packages:check
      - name: Test release automation
        run: node --test scripts/release-packages.test.mjs scripts/publish-packages.test.mjs scripts/trust-packages.test.mjs
      - run: pnpm -r --filter './packages/**' typecheck
      - run: pnpm -r --no-bail --workspace-concurrency=1 --filter './packages/**' test --testTimeout=15000
      - name: Publish lockstep package train
        env:
          # npm attests the workflow's ref and SHA, so provenance requires a tag run.
          # Historical retries from main still use OIDC, without misattributing source.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false && github.ref == format('refs/tags/{0}', inputs.tag) }}
        run: node scripts/publish-packages.mjs
      - name: Verify the published packages in a clean npm consumer
        # A retry checks out the original tag, which may predate this verifier.
        if: ${{ hashFiles('scripts/verify-published-packages.mjs') != '' }}
        run: node scripts/verify-published-packages.mjs
