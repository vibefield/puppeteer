name: Agent surface promotion

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: Candidate vendor
        required: true
        type: choice
        options: [claude, codex, grok, opencode]
      version:
        description: Exact normalized vendor version
        required: true
        type: string
      manifest:
        description: Candidate groundtruth.json on the selected workflow ref
        required: true
        type: string
      confirm:
        description: Type promote; protected-environment review is also required
        required: true
        type: string

permissions:
  contents: read

env:
  AGENT_VENDOR: ${{ inputs.vendor }}
  AGENT_VERSION: ${{ inputs.version }}
  AGENT_MANIFEST: ${{ inputs.manifest }}

concurrency:
  group: agent-surface-promotion-${{ inputs.vendor }}
  cancel-in-progress: false

jobs:
  acquire:
    if: ${{ inputs.confirm == 'promote' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
            executable: agent
          - platform: darwin-x64
            runner: macos-15-intel
            executable: agent
          - platform: linux-x64
            runner: ubuntu-24.04
            executable: agent
          - platform: windows-x64
            runner: windows-2025
            executable: agent.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
      - run: >-
          node scripts/download-agent-artifact.mjs
          --vendor "$AGENT_VENDOR"
          --version "$AGENT_VERSION"
          --platform "${{ matrix.platform }}"
          --output ".agent-adaptation/artifacts/${{ matrix.platform }}/${{ matrix.executable }}"
          --metadata ".agent-adaptation/artifacts/${{ matrix.platform }}/download.json"
      - run: >-
          node scripts/probe-agent-artifact.mjs
          --artifact ".agent-adaptation/artifacts/${{ matrix.platform }}/${{ matrix.executable }}"
          --version "$AGENT_VERSION"
          --output ".agent-adaptation/artifacts/${{ matrix.platform }}/version.txt"
          --home ".agent-adaptation/home/${{ matrix.platform }}"
      - uses: actions/upload-artifact@v7
        with:
          name: promotion-artifact-${{ matrix.platform }}
          path: .agent-adaptation/artifacts
          include-hidden-files: true
          retention-days: 1

  assemble:
    needs: acquire
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: promotion-artifact-*
          path: .agent-adaptation/artifacts
          merge-multiple: true
      - run: >-
          node scripts/assemble-agent-artifacts.mjs
          --vendor "$AGENT_VENDOR"
          --version "$AGENT_VERSION"
          --directory .agent-adaptation/artifacts
          --output .agent-adaptation/acquisition.json
      - uses: actions/upload-artifact@v7
        with:
          name: promotion-acquisition
          path: .agent-adaptation/acquisition.json
          include-hidden-files: true
          retention-days: 1

  pinned-real:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: [self-hosted, puppeteer-agent-live, macOS, ARM64]
            executable: agent
          - platform: darwin-x64
            runner: [self-hosted, puppeteer-agent-live, macOS, X64]
            executable: agent
          - platform: linux-x64
            runner: [self-hosted, puppeteer-agent-live, Linux, X64]
            executable: agent
          - platform: windows-x64
            runner: [self-hosted, puppeteer-agent-live, Windows, X64]
            executable: agent.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter './packages/**'
      - uses: actions/download-artifact@v8
        with:
          pattern: promotion-artifact-*
          path: .agent-adaptation/artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: promotion-acquisition
          path: .agent-adaptation
      - name: Bind the complete acquisition to candidate evidence
        run: >-
          pnpm surface:evidence:artifacts
          --manifest "$AGENT_MANIFEST"
          --artifacts .agent-adaptation/acquisition.json
      - run: >-
          node scripts/stage-agent-candidate.mjs
          --vendor "$AGENT_VENDOR"
          --manifest "$AGENT_MANIFEST"
      - name: Audit the exact candidate model
        env:
          PUPPETEER_CODEX_BIN: ${{ github.workspace }}/.agent-adaptation/artifacts/${{ matrix.platform }}/${{ matrix.executable }}
          PUPPETEER_OPENCODE_BIN: ${{ github.workspace }}/.agent-adaptation/artifacts/${{ matrix.platform }}/${{ matrix.executable }}
        run: pnpm --filter @vibecook/puppeteer-surface run "surface:audit:${AGENT_VENDOR}"
      - name: Claude pinned-real lane
        if: ${{ inputs.vendor == 'claude' }}
        env:
          PUPPETEER_REAL_CLAUDE: '1'
          PUPPETEER_CLAUDE_BIN: ${{ github.workspace }}/.agent-adaptation/artifacts/${{ matrix.platform }}/${{ matrix.executable }}
        run: pnpm --filter @vibecook/puppeteer-adapter-claude test
      - name: Codex pinned-real lane
        if: ${{ inputs.vendor == 'codex' }}
        env:
          CODEX_LIVE: '1'
          PUPPETEER_CODEX_BIN: ${{ github.workspace }}/.agent-adaptation/artifacts/${{ matrix.platform }}/${{ matrix.executable }}
        run: pnpm --filter @vibecook/puppeteer-adapter-codex test
      - name: Grok pinned-real lane
        if: ${{ inputs.vendor == 'grok' }}
        env:
          GROK_LIVE: '1'
          PUPPETEER_GROK_BIN: ${{ github.workspace }}/.agent-adaptation/artifacts/${{ matrix.platform }}/${{ matrix.executable }}
          GROK_LIVE_HOME: ${{ vars.GROK_LIVE_HOME }}
        run: pnpm --filter @vibecook/puppeteer-adapter-grok test
      - name: OpenCode pinned-real lane
        if: ${{ inputs.vendor == 'opencode' }}
        env:
          OPENCODE_LIVE: '1'
          PUPPETEER_OPENCODE_BIN: ${{ github.workspace }}/.agent-adaptation/artifacts/${{ matrix.platform }}/${{ matrix.executable }}
        run: pnpm --filter @vibecook/puppeteer-adapter-opencode test
      - run: >-
          node scripts/write-platform-verification.mjs
          --artifacts .agent-adaptation/acquisition.json
          --artifact ".agent-adaptation/artifacts/${{ matrix.platform }}/${{ matrix.executable }}"
          --version-output-file ".agent-adaptation/artifacts/${{ matrix.platform }}/version.txt"
          --platform "${{ matrix.platform }}"
          --surface-audit passed
          --adapter-real passed
          --output ".agent-adaptation/${{ matrix.platform }}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: promotion-platform-${{ matrix.platform }}
          path: .agent-adaptation/${{ matrix.platform }}.json
          include-hidden-files: true
          retention-days: 1

  verify:
    needs: pinned-real
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/download-artifact@v8
        with:
          pattern: promotion-platform-*
          path: .agent-adaptation/platforms
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: promotion-acquisition
          path: .agent-adaptation
      - name: Bind the tested artifacts to candidate evidence
        run: >-
          pnpm surface:evidence:artifacts
          --manifest "$AGENT_MANIFEST"
          --artifacts .agent-adaptation/acquisition.json
      - run: >-
          pnpm surface:verify
          --vendor "$AGENT_VENDOR"
          --manifest "$AGENT_MANIFEST"
          --platform-report .agent-adaptation/platforms/darwin-arm64.json
          --platform-report .agent-adaptation/platforms/darwin-x64.json
          --platform-report .agent-adaptation/platforms/linux-x64.json
          --platform-report .agent-adaptation/platforms/windows-x64.json
          --output .agent-adaptation/verification.json
      - uses: actions/upload-artifact@v7
        with:
          name: promotion-verification
          path: .agent-adaptation/verification.json
          include-hidden-files: true
          retention-days: 7

  promote:
    needs: verify
    runs-on: ubuntu-24.04
    environment: agent-surface-promotion
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
      - run: pnpm install --frozen-lockfile --filter './packages/**'
      - uses: actions/download-artifact@v8
        with:
          name: promotion-verification
          path: .agent-adaptation
      - uses: actions/download-artifact@v8
        with:
          name: promotion-acquisition
          path: .agent-adaptation
      - name: Restore the attested artifact evidence
        run: >-
          pnpm surface:evidence:artifacts
          --manifest "$AGENT_MANIFEST"
          --artifacts .agent-adaptation/acquisition.json
      - name: Invoke the guarded promotion transaction
        run: >-
          pnpm surface:promote
          --vendor "$AGENT_VENDOR"
          --manifest "$AGENT_MANIFEST"
          --verification .agent-adaptation/verification.json
      - name: Commit artifact evidence, ledger pointer, and generated badge together
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- support/agents.json README.md "${AGENT_MANIFEST%/*}/evidence.json" "${AGENT_MANIFEST%/*}/groundtruth.json" "${AGENT_MANIFEST%/*}/groundtruth.html"
          git commit -m "chore(surface): promote ${AGENT_VENDOR} ${AGENT_VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
